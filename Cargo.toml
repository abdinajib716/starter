[package]
name = "startup"
version = "0.1.0"
authors = ["abdinajib716 <your email>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
icons = { version = "0.19", features = ["dioxus", "dioxus_animated"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tw_merge = "0.1"
wasm-bindgen = "0.2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
uuid = { version = "1", features = ["serde"] }

# ---- server-only (feature "server"); must never reach the wasm build ----
anyhow = { version = "1", optional = true }
argon2 = { version = "0.6", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
ipnet = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
dotenvy = { version = "0.15", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
cron = { version = "0.15", optional = true }
figment = { version = "0.10", features = ["env"], optional = true }
futures-util = { version = "0.3", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json", "ipnet"], optional = true }
tokio = { version = "1", features = ["sync", "time", "rt", "process", "fs", "io-util"], optional = true }
tower-http = { version = "0.6", features = ["request-id", "trace", "util", "set-header", "limit", "timeout"], optional = true }
tracing = { version = "0.1", optional = true }
web-sys = { version = "0.3", default-features = false, features = ["Attr", "Blob", "console", "CssStyleDeclaration", "Document", "DomRect", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "History", "HtmlAnchorElement", "HtmlDocument", "HtmlElement", "HtmlInputElement", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NamedNodeMap", "Node", "NodeList", "PointerEvent", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollToOptions", "Storage", "Url", "Window"] }
dioxus-i18n = "0.6.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:anyhow",
    "dep:argon2",
    "dep:base64",
    "dep:getrandom",
    "dep:ipnet",
    "dep:sha2",
    "dep:dotenvy",
    "dep:chrono",
    "dep:cron",
    "dep:figment",
    "dep:futures-util",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
]

# `dx serve` builds the browser bundle with this profile. opt-level 1 makes the dev wasm much
# faster at runtime (opt-level 0 made interactions such as collapsing the sidebar feel laggy).
[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"
