<!DOCTYPE html>
<html>
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" media="(prefers-color-scheme: light)">
        <link rel="icon" type="image/svg+xml" href="/images/favicon_light.svg" media="(prefers-color-scheme: dark)">
        <link rel="icon" type="image/png" href="/images/favicon.png" media="(prefers-color-scheme: light)">
        <link rel="icon" type="image/png" href="/images/favicon_light.png" media="(prefers-color-scheme: dark)">
        <meta name="title" content="{app_title}">
        <meta name="description" content="Admin dashboard starter built with Rust, Dioxus and Rust/UI.">
        <meta property="og:type" content="website">
        <meta property="og:title" content="{app_title}">
        <meta property="og:description" content="Admin dashboard starter built with Rust, Dioxus and Rust/UI.">
        <meta property="twitter:card" content="summary">
        <meta property="twitter:title" content="{app_title}">
        <meta property="twitter:description" content="Admin dashboard starter built with Rust, Dioxus and Rust/UI.">
        <meta name="theme-color" content="#fff">
        <script>
            /* Theme before first paint (cookie `theme`: light | dark | system), avoids a light flash. */
            (function () {
                var m = document.cookie.match(/(?:^|; )theme=([^;]+)/);
                var t = m ? m[1] : 'system';
                var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.add(dark ? 'dark' : 'light');
                var d = document.cookie.match(/(?:^|; )dir=(rtl|ltr)/);
                if (d) document.documentElement.dir = d[1];
                var f = document.cookie.match(/(?:^|; )font=(inter|manrope|system)/);
                document.documentElement.classList.add('font-' + (f ? f[1] : 'inter'));
            })();
        </script>
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
